name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-sdk:
    name: Rust and TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test authentication library
        run: cargo test -p pg-appsec-auth --all-targets
      - name: Test OAuth state sync worker
        run: cargo test -p pg-appsec-oauth-state-sync --all-targets
      - name: Lint OAuth state sync worker
        run: cargo clippy -p pg-appsec-oauth-state-sync --all-targets -- -D warnings
      - name: Lint authentication library
        run: cargo clippy -p pg-appsec-auth --all-targets -- -D warnings
      - name: Typecheck TypeScript SDK
        run: npx --yes --package typescript@5.8.3 tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext sdk/typescript/index.ts

  postgres-integration:
    name: PostgreSQL 18 SQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appsec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appsec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: appsec_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Ban forced PgBouncer user=
        run: bash tools/check_pgbouncer_no_forced_user.sh
      - name: Regenerate and verify install.sql
        run: |
          python3 tools/build_install_sql.py
          git diff --exit-code sql/install.sql
      - name: Apply SQL migrations
        run: |
          for f in sql/001_roles.sql sql/002_schema.sql sql/003_policies.sql \
                   sql/004_identity_sessions_acl.sql sql/005_schema_security.sql \
                   sql/006_custom_rls.sql sql/007_hardening.sql sql/008_secdefiner_audit_and_pool.sql                    sql/009_close_remaining_risks.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run adversarial SQL tests
        run: psql -v ON_ERROR_STOP=1 -f tests/pg_appsec_adversarial.sql
      - name: Run security regression (custom RLS + ACL)
        run: psql -v ON_ERROR_STOP=1 -f tests/security_regression.sql
      - name: SECURITY DEFINER / RLS audit
        run: psql -v ON_ERROR_STOP=1 -f tests/security_audit_ci.sql
      - name: Hardening regression (gateway, audit chain, pool revoke, ACL cap)
        run: psql -v ON_ERROR_STOP=1 -f tests/hardening_regression.sql
      - name: Remaining risks regression (SET LOCAL, mint harden, audit verify)
        run: psql -v ON_ERROR_STOP=1 -f tests/remaining_risks_regression.sql

  oauth-validator:
    name: OAuth validator E2E (PG18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev python3-cryptography
      - name: Docker PG18 OAuth matrix
        run: bash oauth-validator/ci_docker_e2e.sh

  pooler-e2e:
    name: PgBouncer pooler E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install openssl client tools
        run: sudo apt-get update && sudo apt-get install -y openssl postgresql-client
      - name: Live PgBouncer TLS + per-session SCRAM matrix
        run: bash tests/pooler_e2e.sh
