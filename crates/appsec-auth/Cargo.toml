[package]
name = "pg-appsec-auth"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
pbkdf2 = "0.12"
jsonwebtoken = { version = "9.3", features = ["use_pem"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
