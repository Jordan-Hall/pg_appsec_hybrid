[databases]
appdb = host=postgres.internal port=5432 dbname=appdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
# Each application login session has a distinct app_s_<session UUID> role.
# Never set a forced database `user=`: backend pools must remain per session role.
auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_query = 'SELECT username, password FROM appsec.pgbouncer_lookup($1)'
auth_file = /etc/pgbouncer/userlist.txt
server_tls_sslmode = verify-full
client_tls_sslmode = require
max_client_conn = 5000
default_pool_size = 1
max_db_connections = 300
max_user_connections = 1
# userlist.txt must contain only the dedicated pgbouncer_auth SCRAM verifier.
# Per-session application-role verifiers are fetched by auth_query from pg_appsec.
# Always clear session state between clients. Never set a forced database user=.
server_reset_query = DISCARD ALL
server_reset_query_always = 1
